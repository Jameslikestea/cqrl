[package]
name = "cqrl"
version = "0.1.0"
edition = "2021"

[dependencies]
parser = { version = "0.1.0", path = "parser" }
persistence = {version = "0.1.0", path = "persistence" }
openapigenerator = {version = "0.1.0", path = "openapigenerator"}
errors = {version = "0.1.0", path = "errors" }
pest = "2.7.15"
clap = { version = "4.5.26", features = ["derive"] }
serde_json = "1.0.137"

[workspace]
members = [ "errors", "openapigenerator","parser", "persistence"]
