[package]
name = "cqrl"
version = "0.1.0"
edition = "2021"

[dependencies]
parser = { version = "0.1.0", path = "parser" }
persistence = {version = "0.1.0", path = "persistence" }
openapigenerator = {version = "0.1.0", path = "openapigenerator"}
errors = {version = "0.1.0", path = "errors" }
pest = "2.7.15"
clap = { version = "4.5.26", features = ["derive"] }
serde_json = "1.0.137"
server = { version = "0.1.0", path = "server" }
tokio = { version = "1.43.0", features = ["full"] }
surrealdb = { version = "2.1.4", features = ["http", "protocol-http"] }
events = { version = "0.1.0", path = "events" }

[workspace]
members = [ "errors", "events", "openapigenerator","parser", "persistence", "server"]
