version: "3.9"
networks:
  cqrl-network:
services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
    networks:
      - cqrl-network
  nats-listener:
    image: natsio/nats-box:latest
    command: nats sub -s nats://nats:4222 "cqrl.command.>"
    networks:
      - cqrl-network
  mongo1:
    image: mongodb/mongodb-community-server:latest
    user: root
    command: --replSet rs0 --bind_ip 0.0.0.0 --port 27017
    healthcheck:
      test: cat /mongo-healthcheck.js | mongosh mongodb://localhost:27017/cqrl --quiet
      interval: 5s
      timeout: 30s
    volumes:
      - ./mongo-healthcheck.js:/mongo-healthcheck.js
    ports:
      - "27017:27017"
    networks:
      - cqrl-network
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - "3000:3000"
    networks:
      - cqrl-network
    volumes:
      - ./provisioning:/etc/grafana/provisioning
  alloy:
    image: grafana/alloy:latest
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./config.river:/etc/alloy/config.alloy
    networks:
      - cqrl-network
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks:
      - cqrl-network
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - "--web.enable-remote-write-receiver"
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - cqrl-network

