input:
  nats:
    subject: "cqrl.command.>"
    urls:
      - nats://nats:4222
    queue: bento

output:
  broker:
    pattern: fan_out
    outputs:
      - nats:
          subject: "cqrl.update.posts"
          urls: ["nats://nats:4222"]
        processors:
          - mapping: |
              root.specversion = this.specversion
              root.id = ulid()
              root.source = this.id
              root.type = "posts"
              root.datacontenttype = "application/json"
              root.data = this.data
              root.data.id = this.id
              root.time = this.time
              root.subject = this.id
      - stdout: {}
      - nats:
          subject: "cqrl.permission"
          urls: ["nats://nats:4222"]
        processors:
          - mapping: |
              root.specversion = this.specversion
              root.id = ulid()
              root.source = this.id
              root.type = "posts"
              root.datacontenttype = "application/json"
              root.data = this.data
              root.data.id = this.id
              root.data.type = "permit"
              root.data.level = "read"
              root.authid = this.authid
              root.authtype = this.authtype
              root.time = this.time
              root.subject = this.id