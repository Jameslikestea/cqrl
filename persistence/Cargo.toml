[package]
name = "persistence"
version = "0.1.0"
edition = "2021"

[dependencies]
diesel = { version = "2.2.8", features = ["postgres"] }
errors = { version = "0.1.0", path = "../errors" }
futures = "0.3.31"
indexmap = "2.7.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
surrealdb = { version = "2.1.4", features = ["http", "protocol-http"] }
tokio = { version = "1.43.0", features = ["macros"] }
